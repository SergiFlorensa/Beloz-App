services:
  - type: web
    name: beloz-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend_python
    dockerfilePath: ./backend_python/Dockerfile
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: belozdb
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: SQL_ECHO
        value: "false"

databases:
  - name: belozdb
    databaseName: belozdb
    user: belozdb_user
    plan: free
    region: frankfurt
